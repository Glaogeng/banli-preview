/* 项目定义：t=[轻度起点, 明显起点]，mdc=小于这个变化算持平（拍照误差），max=超过就当识别出错，

/* 今日恢复里已有的三套 */
const REC={
 head:{k:'A',n:'上交叉纠正',why:'改善头前伸、含胸'},
 round:{k:'A',n:'上交叉纠正',why:'改善含胸、肩膀往前扣'},
 shoulder:{k:'C',n:'久坐放松3分钟',why:'放松肩颈'},

};
const EXTRA={hyper:'平时站着膝盖微微放松，别往后锁死。',knee:'膝盖有不适请教练当面看。',hip:'长短腿、骨盆问题请教练或医生当面确认。'};

/* ---------- 关键点 ---------- */
function fromMediaPipe(res){
  const poses=(res&&(res.landmarks||res.poseLandmarks))||(Array.isArray(res)?res:[]);
  const J={};const list=poses&&poses[0];
  if(list)Object.keys(MP).forEach(i=>{const p=list[+i];if(p)J[MP[i]]={x:+p.x,y:+p.y,c:p.visibility!=null?+p.visibility:1};});
  J._people=poses?poses.length:0;return J;
}
function fromWeChat(anchors,w,h){
  const list=anchors||[];const a=list[0];const J={};
  if(a){const pts=a.points||[],cf=a.confidence||[];
    const big=pts.some(p=>p&&(p.x>1.5||p.y>1.5));
    WX.forEach((n,i)=>{const p=pts[i];if(!p)return;let x=+p.x,y=+p.y;if(big&&w&&h){x/=w;y/=h;}J[n]={x,y,c:cf[i]!=null?+cf[i]:(a.score!=null?+a.score:1)};});}
  J._people=list.length;return J;
}
function P(J,n,meta,min){const p=J&&J[n];if(!p||p.x==null||p.y==null)return null;const c=p.c==null?1:+p.c;if(c<(min==null?MIN_C:min))return null;return{x:p.x*meta.w,y:p.y*meta.h,c};}
function mid(a,b){return a&&b?{x:(a.x+b.x)/2,y:(a.y+b.y)/2,c:Math.min(a.c,b.c)}:null;}
function avg2(a,b){return a&&b?mid(a,b):(a||b||null);}
function best2(a,b){return a&&b?(a.c>=b.c?a:b):(a||b||null);}
const D=r=>r*180/Math.PI;
function tiltDeg(a,b){/* 线和水平线的夹角，0~90 */return D(Math.atan2(Math.abs(b.y-a.y),Math.abs(b.x-a.x)||1e-9));}
function vertDeg(top,bot){return D(Math.atan2(Math.abs(top.x-bot.x),Math.abs(bot.y-top.y)||1e-9));}
function ang(a,b,c){const x1=a.x-b.x,y1=a.y-b.y,x2=c.x-b.x,y2=c.y-b.y;const d=Math.hypot(x1,y1)*Math.hypot(x2,y2);if(!d)return null;return D(Math.acos(Math.min(1,Math.max(-1,(x1*x2+y1*y2)/d))));}
function r1(v){return Math.round(v*10)/10;}

/* 身体框：头顶、脚底、身高像素 */
function frame(J,meta){
  const top=[P(J,'nose',meta,0.3),P(J,'leftEar',meta,0.3),P(J,'rightEar',meta,0.3),P(J,'leftEye',meta,0.3),P(J,'rightEye',meta,0.3)].filter(Boolean);
  const feet=[P(J,'leftAnkle',meta,0.3),P(J,'rightAnkle',meta,0.3),P(J,'leftHeel',meta,0.3),P(J,'rightHeel',meta,0.3)].filter(Boolean);
  if(!top.length||!feet.length)return null;
  const headY=Math.min(...top.map(p=>p.y)),footY=Math.max(...feet.map(p=>p.y));
  const ear=avg2(P(J,'leftEar',meta,0.3),P(J,'rightEar',meta,0.3))||P(J,'nose',meta,0.3);
  const ank=avg2(P(J,'leftAnkle',meta,0.3),P(J,'rightAnkle',meta,0.3));
  const H=ank&&ear?ank.y-ear.y:footY-headY;
  if(!(H>0))return null;
  const topY=headY-0.10*H,botY=footY+0.03*H;
  return{H,topY,botY,cx:ank?ank.x:(feet[0].x),ank,ear};
}
/* 像素/厘米：耳到脚踝的高度约是身高的 0.89 */
function pxPerCm(fr,heightCm){const h=+heightCm;if(!fr||!(h>=120&&h<=220))return null;return fr.H/(h*0.89);}

/* ---------- 拍照质量 ---------- */
const Q={
 nobody:'没找到人，请让被拍的人站到画面中间再拍。',
 crowd:'画面里不止一个人，请只留被拍的人再拍。',
 cut:'头或脚没拍全，请往后退一点，头顶到脚底都要在画面里。',
 far:'人在画面里太小了，请走近一点，让人大约占画面高度的三分之二。',
 close:'离得太近了，请往后退一点，上下各留一点空。',
 center:'人没站在画面中间，请站到画面中间再拍。',
 lean:'人没站直，或者手机拿歪了。请自然站直、手机竖直再拍。',
 floor:'两只脚不一样高，可能脚下不平或手机拿歪了，请站在平地上、手机拿正再拍。',
 phoneRoll:'手机左右歪了，请把手机拿正（看屏幕上的水平提示变绿）再拍。',
 phonePitch:'手机前后仰了，请把手机竖直拿，和胸口一样高再拍。',
 notFront:'好像没有正对手机，请身体正对（或正背对）手机再拍。',
 notSide:'侧身转得不够，请转 90 度，让肩膀和手机成一条线再拍。',
 wide:'双脚分得太开了，请两脚和髋差不多宽、脚尖朝前站好再拍。',
 bent:'膝盖弯着，请自然站直（膝盖放松伸直）再拍。',
 arms:'手抬起来了，请双手自然垂在身体两侧再拍。',
 stagger:'两只脚前后错开了，请两脚并排站好再拍。',
 blur:'有些关节看不清（衣服太宽松、光线太暗或挡住了），请穿贴身衣服、换亮一点的地方再拍。'
};
const NEED={front:['nose','leftShoulder','rightShoulder','leftHip','rightHip','leftKnee','rightKnee','leftAnkle','rightAnkle'],
 back:['leftShoulder','rightShoulder','leftHip','rightHip','leftKnee','rightKnee','leftAnkle','rightAnkle']};
function sidePts(J,meta){
  return{ear:best2(P(J,'leftEar',meta),P(J,'rightEar',meta)),sh:avg2(P(J,'leftShoulder',meta),P(J,'rightShoulder',meta)),
   hip:avg2(P(J,'leftHip',meta),P(J,'rightHip',meta)),knee:avg2(P(J,'leftKnee',meta),P(J,'rightKnee',meta)),ank:avg2(P(J,'leftAnkle',meta),P(J,'rightAnkle',meta)),
   nose:P(J,'nose',meta),heel:avg2(P(J,'leftHeel',meta),P(J,'rightHeel',meta)),toe:avg2(P(J,'leftFoot',meta),P(J,'rightFoot',meta))};
}
function widthRatio(J,meta){
  const ls=P(J,'leftShoulder',meta,0.2),rs=P(J,'rightShoulder',meta,0.2),lh=P(J,'leftHip',meta,0.2),rh=P(J,'rightHip',meta,0.2);
  const s=avg2(ls,rs),h=avg2(lh,rh);if(!s||!h)return null;
  const torso=Math.hypot(s.x-h.x,s.y-h.y);if(!torso)return null;
  const w=Math.max(ls&&rs?Math.abs(ls.x-rs.x):0,lh&&rh?Math.abs(lh.x-rh.x):0);
  return w/torso;
}
/* view: front/side/back；meta:{w,h,roll?,pitch?}（roll/pitch 为拍照时手机倾斜度数，有传感器才有） */
function checkPhoto(view,J,meta){
  const why=[];const add=k=>{if(why.indexOf(Q[k])<0)why.push(Q[k]);};
  if(!J||!(J._people>0)&&!J.leftShoulder&&!J.rightShoulder){add('nobody');return{ok:false,reasons:why};}
  if(J._people>1)add('crowd');
  const raw=Object.keys(J).filter(k=>k[0]!=='_').map(k=>J[k]).filter(p=>p&&p.c>=0.3);
  if(raw.length<6){add('nobody');return{ok:false,reasons:why};}
  if(meta.roll!=null&&Math.abs(meta.roll)>4)add('phoneRoll');
  if(meta.pitch!=null&&Math.abs(meta.pitch)>15)add('phonePitch');
  const fr=frame(J,meta);
  if(!fr){add('cut');return{ok:false,reasons:why};}
  if(fr.topY<-0.01*meta.h||fr.botY>1.01*meta.h)add('cut');
  const frac=(fr.botY-fr.topY)/meta.h;
  if(frac<0.45)add('far');else if(frac>0.98)add('close');
  const cx=fr.cx/meta.w;if(cx<0.3||cx>0.7)add('center');
  /* 必须是自然站姿：脚不能分太开、膝不能明显弯、手要垂下 */
  const ang3=(a,b,c)=>a&&b&&c?ang(a,b,c):null;
  ['left','right'].forEach(sd=>{const a=ang3(P(J,sd+'Hip',meta),P(J,sd+'Knee',meta),P(J,sd+'Ankle',meta));if(a!=null&&a<155)add('bent');
    const w=P(J,sd+'Wrist',meta,0.4),sh=P(J,sd+'Shoulder',meta),hp=P(J,sd+'Hip',meta);if(w&&sh&&hp&&w.y<(sh.y+hp.y)/2)add('arms');});
  {const la=P(J,'leftAnkle',meta),ra=P(J,'rightAnkle',meta);if(la&&ra){const dx=Math.abs(la.x-ra.x);if(view==='side'){if(dx>0.12*fr.H)add('stagger');}else if(dx>0.35*fr.H)add('wide');}}
  if(view==='side'){
    const s=sidePts(J,meta);
    if(!s.ear||!s.sh||!s.hip||!s.knee||!s.ank||sideVis(J)<MEAS_C)add('blur');
    else if(vertDeg(s.sh,s.ank)>10)add('lean');
    const wr=widthRatio(J,meta);if(wr!=null&&wr>0.3)add('notSide');
  }else{
    /* 肩、髋要看得清（量高低肩/骨盆）；膝、踝至少能找到（量偏移/膝盖的那几项各自再按可见度判看不准） */
    const miss=NEED[view].filter(n=>!P(J,n,meta,/Shoulder|Hip/.test(n)?MEAS_C:0.4));if(miss.length)add('blur');
    const ls=P(J,'leftShoulder',meta),rs=P(J,'rightShoulder',meta),la=P(J,'leftAnkle',meta),ra=P(J,'rightAnkle',meta);
    if(ls&&rs&&la&&ra){if(vertDeg(mid(ls,rs),mid(la,ra))>8)add('lean');if(tiltDeg(la,ra)>4&&Math.abs(la.x-ra.x)>0.05*fr.H)add('floor');}
    const wr=widthRatio(J,meta);if(wr!=null&&wr<0.35)add('notFront');
  }
  return{ok:!why.length,reasons:why};
}

/* 侧面：耳/肩/髋/膝/踝各取看得更清的一侧，返回其中最低的可见度 */
function sideVis(J){const c=n=>J&&J[n]&&J[n].c!=null?+J[n].c:(J&&J[n]?1:0);
  return Math.min(...['Ear','Shoulder','Hip','Knee','Ankle'].map(k=>Math.max(c('left'+k),c('right'+k))));}
/* 每项用到的关节（算这项的可见度） */
const USES={shoulder:['leftShoulder','rightShoulder'],hip:['leftHip','rightHip'],shift:['leftShoulder','rightShoulder','leftAnkle','rightAnkle'],
 knee:['leftHip','rightHip','leftKnee','rightKnee','leftAnkle','rightAnkle'],head:['Ear','Shoulder'],round:['Shoulder','Hip'],hyper:['Hip','Knee','Ankle']};
function itemVis(key,J){const c=n=>J&&J[n]&&J[n].c!=null?+J[n].c:(J&&J[n]?1:0);const u=USES[key]||[];
  return Math.min(...u.map(n=>n[0]===n[0].toUpperCase()?Math.max(c('left'+n),c('right'+n)):c(n)));}

/* ---------- 实时取景引导（网页 MediaPipe 视频帧 / 小程序 VisionKit 相机帧共用） ----------
   每帧给一句话提示；全部通过且站稳约 1 秒才算 ok，由页面倒数 3-2-1 自动拍。 */
const GUIDE={vis:0.8,minFrac:0.60,maxFrac:0.85,center:0.08,roll:3,pitch:3,jitter:0.006,stableMs:1000,holdMs:1000,fps:6};
const GUIDE_NEED={front:['nose','leftShoulder','rightShoulder','leftHip','rightHip','leftKnee','rightKnee','leftAnkle','rightAnkle'],
 back:['leftShoulder','rightShoulder','leftHip','rightHip','leftKnee','rightKnee','leftAnkle','rightAnkle']};
const HINT={nobody:'站到画面里',crowd:'画面里只留一个人',cut:'脑袋到脚都要在框里',far:'往前走一点',close:'往后退一点',
 toRight:'往画面右边挪一点',toLeft:'往画面左边挪一点',roll:'手机竖直，别左右歪',pitch:'手机竖直，别前后仰',
 front:'转过来，正对手机',back:'身体正背对手机',side:'转到正侧面',arms:'双手自然放下',bent:'膝盖放松伸直',wide:'两脚和髋一样宽',stagger:'两脚并排站',
 vis:'关节看不清：光线亮一点、衣服贴身',still:'站着别动',ok:'很好，保持不动'};
function liveGuide(view,J,meta){
  const r=(code,x)=>Object.assign({ok:code==='ok',code,hint:HINT[code]},x||{});
  if(!J||!(J._people>0))return r('nobody');if(J._people>1)return r('crowd');
  const c=n=>J[n]&&J[n].c!=null?+J[n].c:(J[n]?1:0);
  const fr=frame(J,meta);
  const feet=Math.max(c('leftAnkle'),c('rightAnkle'));const head=Math.max(c('nose'),c('leftEar'),c('rightEar'));
  if(!fr||feet<0.5||head<0.5)return r('cut');
  const lo=['leftAnkle','rightAnkle','leftHeel','rightHeel','leftFoot','rightFoot'].map(n=>P(J,n,meta,0.3)).filter(Boolean);
  const maxY=Math.max(fr.botY,...lo.map(p=>p.y+0.01*fr.H));
  if(fr.topY<0.005*meta.h||maxY>0.995*meta.h)return r('cut');
  const frac=(fr.botY-fr.topY)/meta.h;
  if(frac<GUIDE.minFrac)return r('far',{frac});if(frac>GUIDE.maxFrac)return r('close',{frac});
  const sh=avg2(P(J,'leftShoulder',meta,0.3),P(J,'rightShoulder',meta,0.3));const bx=((sh?sh.x:fr.cx)+fr.cx)/2/meta.w;
  if(bx<0.5-GUIDE.center)return r('toRight',{frac,cx:bx});if(bx>0.5+GUIDE.center)return r('toLeft',{frac,cx:bx});
  if(meta.roll!=null&&Math.abs(meta.roll)>GUIDE.roll)return r('roll');
  if(meta.pitch!=null&&Math.abs(meta.pitch)>GUIDE.pitch)return r('pitch');
  const wr=widthRatio(J,meta);
  if(view==='side'){
    const s=sidePts(J,meta);
    const prof=wr!=null&&wr<=0.25&&s.nose&&s.ear&&Math.abs(s.nose.x-s.ear.x)>0.02*fr.H;
    if(!prof)return r('side',{wr});
    const la=P(J,'leftAnkle',meta),ra=P(J,'rightAnkle',meta);if(la&&ra&&Math.abs(la.x-ra.x)>0.12*fr.H)return r('stagger');
    if(sideVis(J)<GUIDE.vis||c('nose')<GUIDE.vis)return r('vis');
  }else{
    if(wr==null||wr<0.4)return r(view==='front'?'front':'back',{wr});
    if(view==='front'){const ls=P(J,'leftShoulder',meta,0.3),rs=P(J,'rightShoulder',meta,0.3);if(ls&&rs&&ls.x<rs.x)return r('front',{wr});}

/* 抖动：几帧里主要关节位置的标准差（按耳到脚踝高度归一），越小越稳 */
const JIT_PTS=['nose','leftShoulder','rightShoulder','leftHip','rightHip','leftKnee','rightKnee','leftAnkle','rightAnkle'];
function jitterOf(list,meta){
  if(!list||list.length<3)return Infinity;const fr=frame(list[list.length-1],meta);if(!fr)return Infinity;let worst=0,n=0;
  JIT_PTS.forEach(k=>{const ps=list.map(J=>P(J,k,meta,0.5)).filter(Boolean);if(ps.length<list.length)return;n++;
    const sd=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length);};
    worst=Math.max(worst,sd(ps.map(p=>p.x)),sd(ps.map(p=>p.y)));});

/* 背面/腿并拢时识别有时会把左右腿认反。几帧之间按第一帧把每一对左右关节对齐，再取中位数 */

  if(!list||list.length<2)return list;const R=list[0];

  const d=(a,b)=>a&&b?Math.hypot(a.x-b.x,a.y-b.y):0;
  return list.map((J,i)=>{if(!i)return J;const o=Object.assign({},J);
    PAIRS.forEach(n=>{const L='left'+n,Rr='right'+n;if(!J[L]||!J[Rr]||!R[L]||!R[Rr])return;
      if(d(J[L],R[Rr])+d(J[Rr],R[L])<d(J[L],R[L])+d(J[Rr],R[Rr])-1e-9){o[L]=J[Rr];o[Rr]=J[L];}});return o;});
}
/* 几次识别里偶尔有一次认错（比如把背景认成人）。和中位数差太多（>身高 5%）的那次丢掉 */
const CORE_PTS=['leftShoulder','rightShoulder','leftHip','rightHip','nose'];

  if(!list||list.length<3)return list;const M=medianJ(list);const fr=frame(M,meta);if(!fr)return list;
  const dev=J=>{let w=0;CORE_PTS.forEach(k=>{const a=P(J,k,meta,0),b=P(M,k,meta,0);if(a&&b)w=Math.max(w,Math.hypot(a.x-b.x,a.y-b.y));});return w;};

/* 几帧取中位数（每个关节 x/y/可见度分别取中位数），比单帧稳 */
function medianJ(list){

  const keys={};L.forEach(J=>Object.keys(J).forEach(k=>{if(k[0]!=='_')keys[k]=1;}));const out={};
  Object.keys(keys).forEach(k=>{const ps=L.map(J=>J[k]).filter(p=>p&&p.x!=null);if(ps.length*2<L.length)return;
    out[k]={x:med(ps.map(p=>+p.x)),y:med(ps.map(p=>+p.y)),c:med(ps.map(p=>p.c==null?1:+p.c))};});
  out._people=Math.max(...L.map(J=>J._people||0));out._n=L.length;return out;

/* 连拍每帧各量一次，估计这项数值有多不稳；不稳到可能分错级（95% 区间超过「轻度」档宽的一半）就写看不准 */
function burstSpread(view,list,meta,heightCm){
  const vals={};(list||[]).forEach(J=>{const m=measurePhoto(view,J,meta,heightCm);Object.keys(m).forEach(k=>{if(k[0]==='_'||!m[k]||m[k].v==null)return;(vals[k]=vals[k]||[]).push(m[k].v*(m[k].s||1));});});
  /* 返回中位数的标准误（约 1.25×标准差/√帧数）：越大越不稳 */
  const out={};Object.keys(vals).forEach(k=>{const a=vals[k];if(a.length<3)return;const m=a.reduce((x,y)=>x+y,0)/a.length;const sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/(a.length-1));out[k]=Math.round(1.2533*sd/Math.sqrt(a.length)*100)/100;});return out;
}

/* ---------- 每张照片的量 ---------- */
/* side 用人的左右：front 画面左边是人的右边；back 画面左边是人的左边 */
function personSide(view,imgLeft){return view==='front'?(imgLeft?'右':'左'):(imgLeft?'左':'右');}
function lrTilt(view,a,b){/* 返回 {deg, low:'左'|'右', dy(px), sign:+左低} */
  const L=a.x<b.x?a:b,R=a.x<b.x?b:a;const deg=tiltDeg(L,R);const lowImgLeft=L.y>R.y;
  const low=personSide(view,lowImgLeft);return{deg,low,dy:Math.abs(L.y-R.y),sign:low==='左'?1:-1};
}
function measurePhoto(view,J,meta,heightCm){
  const out={};const fr=frame(J,meta);const ppc=pxPerCm(fr,heightCm);
  const cm=px=>ppc?r1(px/ppc):null;
  if(view==='front'||view==='back'){
    const ls=P(J,'leftShoulder',meta),rs=P(J,'rightShoulder',meta);
    if(ls&&rs){const t=lrTilt(view,ls,rs);out.shoulder={v:r1(t.deg),s:t.sign,side:t.low,cm:cm(t.dy)};}
    const lh=P(J,'leftHip',meta),rh=P(J,'rightHip',meta);
    if(lh&&rh){const t=lrTilt(view,lh,rh);out.hip={v:r1(t.deg),s:t.sign,side:t.low,cm:cm(t.dy)};}
    const la=P(J,'leftAnkle',meta),ra=P(J,'rightAnkle',meta);
    if(ls&&rs&&la&&ra&&fr){const sc=mid(ls,rs),ac=mid(la,ra);const dx=sc.x-ac.x;
      const toImgRight=dx>0;const side=view==='front'?(toImgRight?'左':'右'):(toImgRight?'右':'左');
      out.shift={v:r1(Math.abs(dx)/fr.H*100),s:side==='左'?1:-1,side,cm:cm(Math.abs(dx))};}
    if(view==='front'&&lh&&rh){
      const midX=(lh.x+rh.x)/2;const legs=[];
      [['left',lh],['right',rh]].forEach(([s,hp])=>{
        const k=P(J,s+'Knee',meta),a=P(J,s+'Ankle',meta);if(!k||!a||a.y-hp.y<=0)return;
        const lx=hp.x+(a.x-hp.x)*(k.y-hp.y)/(a.y-hp.y);const off=k.x-lx;
        const toMid=Math.sign(midX-lx)||1;const dev=180-(ang(hp,k,a)||180);
        const sign=Math.sign(off)===toMid?1:-1;/* +1 往里靠 */
        legs.push({side:personSide(view,hp.x<midX),v:r1(dev),dir:sign});
      });
      if(legs.length===2){const w=legs[0].v>=legs[1].v?legs[0]:legs[1];
        out.knee={v:w.v,s:w.dir,side:w.side,dir:w.dir>0?'in':'out',legs};}
    }
  }else if(view==='side'){
    const s=sidePts(J,meta);
    let f=0;/* +1 脸朝画面右边 */
    if(s.nose&&s.ear&&Math.abs(s.nose.x-s.ear.x)>0.015*(fr?fr.H:meta.h))f=Math.sign(s.nose.x-s.ear.x);
    else if(s.toe&&s.heel&&Math.abs(s.toe.x-s.heel.x)>0.02*(fr?fr.H:meta.h))f=Math.sign(s.toe.x-s.heel.x);
    out._facing=f;
    if(f&&s.ear&&s.sh){const fw=(s.ear.x-s.sh.x)*f,up=s.sh.y-s.ear.y;
      if(up>0)out.head={v:r1(D(Math.atan2(fw,up))),cm:cm(Math.max(0,fw))};}
    if(f&&s.sh&&s.hip){const fw=(s.sh.x-s.hip.x)*f,tl=s.hip.y-s.sh.y;if(tl>0)out.round={v:r1(fw/tl*100)};}
    if(f&&s.hip&&s.knee&&s.ank&&s.ank.y>s.hip.y){
      const lx=s.hip.x+(s.ank.x-s.hip.x)*(s.knee.y-s.hip.y)/(s.ank.y-s.hip.y);const off=(s.knee.x-lx)*f;
      const dev=180-(ang(s.hip,s.knee,s.ank)||180);out.hyper={v:r1(off<0?dev:-dev)};}
  }
  return out;
}

/* ---------- 分级与文字 ---------- */
function gradeOf(key,v){
  const it=itemOf(key);if(v==null||!isFinite(v))return'看不准';
  const a=Math.abs(v);if(a>it.max)return'看不准';
  if(key==='head'||key==='round'||key==='hyper'){if(v<it.t[0])return'正常';}

const fmt=(v,u)=>r1(Math.abs(v))+(u==='°'?'°':'%');
function textOf(key,m,grade){
  const it=itemOf(key);

  const cm=m.cm!=null&&m.cm>=0.5?'约 '+m.cm+' 厘米':'';
  switch(key){
   case'shoulder':return grade==='正常'?'两边肩膀差不多高。':`${m.side}肩比另一边低${cm?cm+'（'+fmt(m.v,'°')+'）':'约 '+fmt(m.v,'°')}。`;
   case'hip':return grade==='正常'?'骨盆左右差不多高。':`骨盆${m.side}侧偏低${cm?cm+'（'+fmt(m.v,'°')+'）':'约 '+fmt(m.v,'°')}，穿衣和站姿也会影响，仅作参考。`;
   case'shift':return grade==='正常'?'上身基本在两脚中间。':`上身往${m.side}偏${cm?cm:'约身高的 '+fmt(m.v,'%')}，站立时重心可能偏${m.side}。`;
   case'knee':if(grade==='正常')return'站立时两边膝盖基本对着脚尖。';return m.dir==='in'?`${m.side}膝往里靠（X 型腿倾向），约 ${fmt(m.v,'°')}。`:`${m.side}膝往外分（O 型腿倾向），约 ${fmt(m.v,'°')}。`;
   case'head':return grade==='正常'?'耳朵基本在肩膀正上方。':`头往前探，耳朵比肩膀靠前${cm?cm:''}（约 ${fmt(m.v,'°')}）。`;
   case'round':return grade==='正常'?'没看出明显圆肩。':`肩膀可能有点往前扣（圆肩倾向）。照片只能粗看，请教练当面确认。`;
   case'hyper':return grade==='正常'?'站立时膝盖没有明显往后顶。':`站立时膝盖往后顶（膝超伸），约 ${fmt(m.v,'°')}。`;
  }

}

/* 会员看的说法：只说方向和程度，不带度数/厘米/百分比（达 2026-11-16 定：会员端只显示 正常/轻度/明显/看不准，数字只给教练看） */
/* 优先改善的排序（按影响大小排）：
   1) 先按程度：明显 在 轻度 前面；正常、看不准不排；
   2) 同一程度里，按「超出正常范围多少」排：over = (|数值| − 轻度起点) ÷ (明显起点 − 轻度起点)。
      每项用自己的分档换算，所以 4° 的高低肩和 15° 的头前伸可以放在一起比；over 越大越靠前；

function plainText(it){
  if(!it)return'';const g=it.grade;if(g==='看不准')return it.text||'这项看不准。';

   case'shift':return g==='正常'?'上身基本在两脚中间。':`上身往${sd}偏${x}，站着时重心可能偏${sd}。`;
   case'knee':return g==='正常'?'站立时两边膝盖基本对着脚尖。':it.dir==='in'?`${sd}膝往里靠${x}（X 型腿倾向）。`:`${sd}膝往外分${x}（O 型腿倾向）。`;

   case'round':return g==='正常'?'没看出明显圆肩。':'肩膀可能有点往前扣（圆肩倾向）。照片只能粗看，请教练当面确认。';

/* 程度格：正常 1 格、轻度 2 格、明显 3 格、看不准 0 格 */
const LEVEL={正常:1,轻度:2,明显:3,看不准:0};
/* 会员看的变化：只说好转/变差/持平/都正常/没法比 */
function trendWord(d){if(!d)return'';if(d.txt==='都正常')return'都正常';return d.trend;}
/* photos: {front:{J,w,h,roll,pitch,skip?}, side:..., back:...}; opt:{heightCm, injuries} */
function assess(photos,opt){
  opt=opt||{};const per={},quality={};
  const unsure={};/* key -> 原因：关节看不清 / 连拍不稳 */
  VIEWS.forEach(({id})=>{const p=photos&&photos[id];
    if(!p||p.skip||!p.J){quality[id]={ok:false,reasons:['这个角度没有拍。'],skipped:true};return;}
    const meta={w:p.w||1,h:p.h||1,roll:p.roll,pitch:p.pitch};
    quality[id]=checkPhoto(id,p.J,meta);
    per[id]=quality[id].ok?measurePhoto(id,p.J,meta,opt.heightCm):{};
    if(quality[id].ok)ITEMS.forEach(it=>{if(it.views.indexOf(id)<0||!per[id][it.key])return;
      if(itemVis(it.key,p.J)<MEAS_C){delete per[id][it.key];unsure[it.key]=unsure[it.key]||'相关关节看得不够清楚，这项看不准，先不下结论。';}
      else if(p.spread&&p.spread[it.key]!=null&&p.spread[it.key]>it.tol){delete per[id][it.key];unsure[it.key]=unsure[it.key]||'连拍几帧结果不稳定（人在动或关节被挡），这项看不准，建议重拍。';}});
  });

    const got=it.views.map(v=>({v,m:per[v]&&per[v][it.key]})).filter(x=>x.m);
    let m=null,why='';
    const fromViews=it.views.filter(v=>quality[v]&&quality[v].ok);
    if(!fromViews.length)why=`${it.views.map(v=>VIEWS.find(x=>x.id===v).n).join('/')}照片没拍好，这项看不准，先不下结论，可以按提示重拍。`;
    else if(it.key==='hyper'||it.key==='head'||it.key==='round'){if(per.side&&!per.side._facing)why='分不清脸朝哪边，这项看不准。';}
    if(!why&&!got.length)why=unsure[it.key]||'相关关节看不清，这项看不准，先不下结论，可以按提示重拍。';
    if(!why){
      if(got.length===2){

    const out={key:it.key,n:it.n,unit:it.unit,grade,v:grade==='看不准'?null:m.v,maybe:!!it.maybe,views:it.views};
    if(grade!=='看不准'){['side','cm','dir','s','legs'].forEach(k=>{if(m[k]!=null)out[k]=m[k];});}
    out.text=textOf(it.key,grade==='看不准'?{why}:m,grade);

}
function injuryNotes(items,injuries){
  const list=(injuries||[]).filter(x=>x&&x!=='无明显伤病');if(!list.length)return[];
  const out=[];const flagged=items.filter(i=>i.grade==='轻度'||i.grade==='明显').map(i=>i.key);
  const has=w=>list.some(j=>String(j).indexOf(w)>=0);

  if((has('腰')||has('髋'))&&flagged.some(k=>['hip','shift'].includes(k)))out.push('你的身体档案里写了腰/髋不适，做纠正动作时幅度小一点，有疼痛就停。');
  if(has('膝')&&flagged.some(k=>['knee','hyper'].includes(k)))out.push('你的身体档案里写了膝盖不适，膝盖问题请教练当面看，有疼痛请就医。');
  return out;
}
function recsOf(items){
  const seen={},out=[];(items||[]).forEach(i=>{if(i.rec&&!seen[i.rec.k]){seen[i.rec.k]=1;out.push({k:i.rec.k,n:i.rec.n,for:[]});}if(i.rec)out.find(x=>x.k===i.rec.k).for.push(i.n.replace('（可能）',''));});
  return out;
}

/* ---------- 对比 ---------- */
function delta(key,a,b){/* a=旧，b=新（item 对象） */
  const it=itemOf(key);

  const va=key==='head'||key==='round'||key==='hyper'?Math.max(0,a.v):Math.abs(a.v);
  const vb=key==='head'||key==='round'||key==='hyper'?Math.max(0,b.v):Math.abs(b.v);
  const d=r1(vb-va);
  if(a.grade==='正常'&&b.grade==='正常')return{trend:'持平',d,txt:'都正常'};/* 正常范围内的小变化不算好转/变差 */

  out.slice().forEach(m=>{if(m.name==='上斜方肌/肩胛提肌'){const d=out.find(x=>x.name==='上斜方肌'&&x.side===m.side);if(d){d.why.forEach(w=>{if(m.why.indexOf(w)<0)m.why.push(w);});out.splice(out.indexOf(d),1);}}});
