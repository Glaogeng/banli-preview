${l.map(r=>{const s=st(r);return `<div class=row style="border-top:1px solid #f2f2f2;padding:8px 0;align-items:flex-start"><div style="flex:1"><b style="font-family:monospace;font-size:16px" onclick="cp('${CC.fmt(r.code)}')">${CC.fmt(r.code)}</b> <span style="color:${s[1]};font-size:12px">● ${s[0]}</span><p class=muted style="font-size:12px">${r.name} · ${r.days}天 · ${r.store}${r.expire?' · 截止 '+r.expire:''}</p>${r.status==='used'?`<p class=muted style="font-size:12px">${r.usedBy} · ${r.usedAt}</p>`:''}</div>${r.status==='unused'?`<button class="btn sm ghost" onclick="voidC('${r.code}')">作废</button>`:''}</div>`}).join('')||'<p class="muted center">暂无</p>'}</div>
<p class="muted center">演示版：数据只存在这台设备的浏览器里，与同一浏览器打开的会员预览共享。正式版走微信云开发。</p>`;
 [['#sT',v=>F.type=v],['#sS',v=>F.store=v],['#sF',v=>flt=v]].forEach(([id,f])=>$(id).onclick=e=>{const v=e.target.dataset.v;if(v!==undefined){f(v);R()}})}
R();
</script></body></html>
